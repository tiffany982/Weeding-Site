<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiffany &amp; Jacob | RSVP Closed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='54' font-size='72' text-anchor='middle' dominant-baseline='central'%3E♥️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/coterie.css">
<link rel="stylesheet" href="fonts/garamond.css">
<link rel="stylesheet" href="fonts/script.css">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --red:#D9310B; --red-dk:#a6260a; --wine:#7a1420; --cream:#f4ead3; --ivory:#f7f1e4; --ink:#2a1710;
        --coterie:'Coterie',Georgia,serif; --garamond:'EB Garamond',Georgia,serif; --script:'Pinyon Script',cursive; --sans:'Lato',Arial,sans-serif;
    }
    body { min-height: 100svh; background: #e7ddc6; font-family: var(--garamond); color: var(--ink); }
    .polaroids { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .polaroid { position: absolute; width: clamp(150px, 24vw, 270px); background: #fff; padding: 10px 10px 32px; border-radius: 2px; box-shadow: 0 16px 34px rgba(0,0,0,0.22); animation: drop 1s cubic-bezier(.18,.7,.25,1) both; }
    .polaroid img { display: block; width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #d8ceb7; }
    @keyframes drop { 0% { transform: translateY(-130vh) rotate(var(--r)); opacity: 0; } 55% { opacity: 1; } 100% { transform: translateY(0) rotate(var(--r)); opacity: 1; } }
    .page-dim { position: fixed; inset: 0; z-index: 1; background: rgba(231,221,198,0.66); }
    .back { position: fixed; top: 16px; left: 16px; z-index: 6; font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); text-decoration: none; background: rgba(244,234,211,0.9); padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(217,49,11,0.3); }
    .wrap { position: relative; z-index: 2; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 66px 18px 54px; }
    .playing-card { position: relative; width: min(93vw, 560px); background: var(--ivory); border: 2px solid rgba(217,49,11,0.25); border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.4); padding: 56px 30px 56px; text-align: center; }
    .card-corner { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 0.82; color: var(--red); }
    .card-corner .letter { font-family: var(--script); font-size: 60px; }
    .card-corner .pip { font-size: 30px; margin-top: 2px; }
    .card-corner.tl { top: 26px; left: 30px; }
    .card-corner.br { bottom: 26px; right: 30px; transform: rotate(180deg); }
    .c-eyebrow { font-family: var(--sans); font-size: 9px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
    .c-title { font-family: var(--coterie); text-transform: uppercase; font-size: clamp(30px, 7vw, 50px); color: var(--wine); line-height: 0.95; margin-bottom: 6px; }
    .c-script { font-family: var(--script); font-size: clamp(22px, 5.5vw, 34px); color: var(--red); line-height: 0.85; margin-bottom: 26px; }
    .closed-msg { font-family: var(--garamond); font-size: clamp(17px, 3vw, 21px); line-height: 1.6; color: var(--ink); max-width: 420px; margin: 0 auto 28px; }
    .btn { display: inline-block; background: var(--red); color: #fff; font-family: var(--sans); font-weight: 700; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; padding: 14px 22px; border-radius: 3px; box-shadow: 0 4px 0 var(--red-dk); }
    .btn:hover { background: var(--red-dk); }
</style>
</head>
<body>

<div class="polaroids" id="polaroids"></div>
<div class="page-dim"></div>
<a class="back" href="/">&#9668; Main Menu</a>

<div class="wrap">
    <div class="playing-card">
        <span class="card-corner tl"><span class="letter">T</span><span class="pip">&#9829;</span></span>
        <span class="card-corner br"><span class="letter">J</span><span class="pip">&#9829;</span></span>
        <p class="c-eyebrow">The Window Has Closed</p>
        <h1 class="c-title">RSVP Closed</h1>
        <p class="c-script">that's a wrap</p>
        <p class="closed-msg">Oh no, you missed the window to RSVP! &#x1F972; Please check out the details page if you're attending the wedding.</p>
        <a class="btn" href="/details">See the Details</a>
    </div>
</div>

<script>
    const GP = [
        'images/gallery/20230408_111452.jpg','images/gallery/20230722_201701.jpg','images/gallery/20230722_201821.jpg',
        'images/gallery/20250421_184002.jpg','images/gallery/20250731_083121.jpg','images/gallery/20250902_155040.jpg',
        'images/gallery/elop_IMG_6852.CR2.jpg','images/gallery/elop_IMG_6853.CR2.jpg','images/gallery/enga_IMG_6588.CR2.jpg'
    ];
    const SPOTS = [
        {x:1,y:5,r:-8},{x:71,y:3,r:7},{x:82,y:38,r:-6},{x:-3,y:42,r:6},{x:-1,y:74,r:-5},
        {x:76,y:70,r:8},{x:40,y:87,r:-7},{x:88,y:10,r:5},{x:20,y:26,r:9}
    ];
    const wall = document.getElementById('polaroids');
    SPOTS.forEach((s, i) => {
        const p = document.createElement('div');
        p.className = 'polaroid';
        p.style.left = s.x + '%'; p.style.top = s.y + '%';
        p.style.setProperty('--r', s.r + 'deg');
        p.style.animationDelay = (i * 0.14) + 's';
        const im = document.createElement('img'); im.src = GP[i % GP.length];
        p.appendChild(im); wall.appendChild(p);
    });
</script>

</body>
</html>
